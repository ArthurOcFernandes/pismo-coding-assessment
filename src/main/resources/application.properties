spring.application.name=pismo-coding-assessment

# Database
spring.datasource.url=jdbc:mariadb://${MARIADB_HOST:mariadb}:${MARIADB_PORT:3306}/${MARIADB_DATABASE:mydatabase}
spring.datasource.username=${MARIADB_USER:user}
spring.datasource.password=${MARIADB_PASSWORD:secret-password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Json Serialization

spring.jackson.property-naming-strategy=SNAKE_CASE